<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Web of Memories – 3D Polaroid Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="trail" aria-hidden="true"></div><div id="dot" aria-hidden="true"></div>

<header class="bar">
  <button id="modeBtn" title="Cinematic / bright mode">◐ Mode</button>
  <button id="shotBtn" title="Save a screenshot of the whole page">📷 Screenshot</button>
  <button id="vidBtn" title="Record this page with the music and download it as an MP4 video (rendered smoothly, no screen-share prompt)">⬇ Video</button>
  <button id="resetBtn" title="Remove all photos">Reset</button>
</header>

<div class="scene">
<main class="stage" id="stage">
  <div class="bg"></div>
  <svg class="silk" viewBox="0 0 1152 2048" aria-hidden="true">
    <path d="M170 800 Q300 900 358 1000"/><path d="M170 800 Q110 960 160 1040"/><path d="M270 800 Q420 770 590 705"/><path d="M270 800 Q520 1500 548 1590"/>
  </svg>

  <figure class="frame" data-i="0" style="--x:44;--y:45;--w:510;--h:523">
    <button class="slot" aria-label="Add photo to frame 1"><span class="add">+ Add Photo<small>click or drop an image</small></span></button>
    <input class="cap" maxlength="40" placeholder="Add a caption…" aria-label="Caption for frame 1">
    <div class="tools"><button data-a="replace" aria-label="Replace photo">↻</button><button data-a="dl" aria-label="Download photo">⬇</button><button data-a="rm" aria-label="Remove photo">✕</button></div>
  </figure>
  <figure class="frame" data-i="1" style="--x:580;--y:1262;--w:523;--h:536;--capw:44%">
    <button class="slot" aria-label="Add photo to frame 2"><span class="add">+ Add Photo<small>click or drop an image</small></span></button>
    <input class="cap" maxlength="40" placeholder="Add a caption…" aria-label="Caption for frame 2">
    <div class="tools"><button data-a="replace" aria-label="Replace photo">↻</button><button data-a="dl" aria-label="Download photo">⬇</button><button data-a="rm" aria-label="Remove photo">✕</button></div>
  </figure>

  <section class="player" id="player" aria-label="Music player">
    <div class="art"><div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="meta"><b id="title">Midnight Web</b><small id="sub">Track 1 / 3</small></div>
    <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek">
    <div class="ctl">
      <button class="gbtn" id="pPrev" aria-label="Previous track">⏮</button>
      <button class="gbtn big" id="pPlay" aria-label="Play">▶</button>
      <button class="gbtn" id="pNext" aria-label="Next track">⏭</button>
    </div>
    <div class="volrow"><span aria-hidden="true">🔈</span><input id="vol" type="range" min="0" max="1" step="0.05" value="0.3" aria-label="Volume"></div>
    <label class="addsong">+ Add your own song<input type="file" id="songIn" accept="audio/*" hidden></label>
  </section>

  <svg class="spider" id="spider" viewBox="0 0 200 200" aria-hidden="true">
    <defs><radialGradient id="bodyG" cx=".35" cy=".3"><stop offset="0" stop-color="#ff6a5a"/><stop offset=".35" stop-color="#a01818"/><stop offset="1" stop-color="#2a0505"/></radialGradient></defs>
    <line x1="100" y1="0" x2="100" y2="90" class="thread"/>
    <g id="sbody"><g id="legs"></g>
      <ellipse cx="100" cy="122" rx="17" ry="22" fill="url(#bodyG)"/><ellipse cx="100" cy="92" rx="11" ry="12" fill="url(#bodyG)"/>
      <circle cx="96" cy="86" r="1.8" fill="#fff"/><circle cx="104" cy="86" r="1.8" fill="#fff"/>
      <path d="M92 112 q8 -6 16 0" stroke="#ff8a7a" stroke-width="1.4" fill="none" opacity=".7"/></g>
  </svg>
</main>
</div>

<p class="help">Click a frame or drop a JPG / PNG / WebP on it · drag one photo onto the other frame to swap · move near the spider.</p>

<div id="modal" hidden role="dialog" aria-modal="true" aria-label="Photo preview">
  <button id="prev" aria-label="Previous photo">‹</button>
  <figure><img id="big" alt=""><figcaption id="bigCap"></figcaption></figure>
  <button id="next" aria-label="Next photo">›</button>
  <button id="close" aria-label="Close preview">✕</button>
  <a id="bigDl" class="dl" download="photo.jpg">⬇ Download</a>
</div>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
<script src="scene-data.js"></script>
<script src="script.js"></script>
</body>
</html>
